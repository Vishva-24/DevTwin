services:
  postgres:
    image: postgres:15-alpine
    container_name: devtwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtwin
      POSTGRES_PASSWORD: devtwin_pass
      POSTGRES_DB: devtwin
    ports:
      - "5432:5432"
    volumes:
      - devtwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtwin -d devtwin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devtwin_pgdata:
    driver: local
